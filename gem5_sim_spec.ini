# =====================================================================
# Autonomous gem5 Architecture Cluster Simulation Profile
# Open-Source Showroom Evaluation Baseline File
# =====================================================================
[System_Cluster_Configuration]
architecture_mode = CUSTOM_SHAKTI_HPC
simulated_cores = 64
target_clock_frequency = 4.2GHz
voltage_domain = 0.6V

[Memory_Subsystem]
l1_cache_size = 32kB
l2_cache_size = 512kB
l3_shared_cache = 16MB
memory_type = DDR5_4800_8x8

[Network_On_Chip]
noc_topology = crossbar
routing_algorithm = shortest_path
link_bandwidth_bytes_cycle = 64
